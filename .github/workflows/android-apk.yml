name: Build Bilimdon Kids Android APK

on:
  push:
    branches: ["feature/integrate-legacy-kids-ui"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install project dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Add Android microphone permission
        run: node scripts/patch-android-permissions.js

      - name: Verify Android microphone permission declaration
        run: |
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' android/app/src/main/AndroidManifest.xml

      - name: Sync Android project
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bilimdon-kids-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  smoke-test:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed AI tutor and Uzbek speech
        env:
          APP_URL: https://bilimdon-kids-ai-xjd1.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.APP_URL;
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          let health;
          for (let attempt = 1; attempt <= 18; attempt++) {
            try {
              const response = await fetch(base + "/api/health", { signal: AbortSignal.timeout(15000) });
              if (response.ok) {
                health = await response.json();
                if (health.gemini) break;
              }
            } catch {}
            await wait(10000);
          }
          if (!health?.aiConfigured) throw new Error("Live server/AI health check failed");
          console.log("Health check: OK");
          const tutorStart = Date.now();
          const tutorResponse = await fetch(base + "/api/ai/guest-tutor", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ promptText: "Salom, ustoz! 2 + 2 nechchi?", childName: "Sinov", childAge: 7 }),
            signal: AbortSignal.timeout(90000)
          });
          const tutor = await tutorResponse.json();
          if (!tutorResponse.ok || typeof tutor.answer !== "string" || !tutor.answer.trim()) {
            throw new Error("AI tutor smoke test failed: " + JSON.stringify(tutor));
          }
          console.log("AI tutor: OK (" + (Date.now() - tutorStart) + " ms)");
          const liveResponse = await fetch(base + "/api/live-token", {
            signal: AbortSignal.timeout(90000),
            headers: { "Cache-Control": "no-store" }
          });
          const live = await liveResponse.json();
          if (!liveResponse.ok || typeof live.token !== "string" || !live.model) {
            throw new Error("Gemini Live token check failed: " + JSON.stringify(live));
          }
          console.log("Gemini Live token: OK (" + live.model + ")");
          NODE
