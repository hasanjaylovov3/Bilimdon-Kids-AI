services:
  - type: web
    name: bilimdon-kids-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SESSION_DAYS
        value: "14"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
