    const playSound = (type, muted) => {
      if (muted) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          osc.frequency.setValueAtTime(1046.5, now + 0.3);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc.start(now);
          osc.stop(now + 0.55);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.setValueAtTime(170, now + 0.15);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(620, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {}

    async function askBilimdonTutor(promptText, _customApiKey, childName = 'Ali', childId = '') {
      const signedIn = Boolean(childId);
      const res = await fetch(signedIn ? '/api/ai/tutor' : '/api/ai/guest-tutor', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(signedIn
          ? { message: promptText, childId, subject: 'general' }
          : { promptText, childName, childAge: 7 })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "AI ustoz bilan bog‘lanib bo‘lmadi.");
      return data.answer;
    }

        try {

          const { GoogleGenAI } = await import("https://esm.sh/@google/genai");
          const tokenResponse = await fetch("/api/live-token", { credentials: "same-origin", cache: "no-store" });
          const tokenData = await tokenResponse.json().catch(() => ({}));
          if (!tokenResponse.ok || !tokenData.token) throw new Error(tokenData.error || "Ovozli AI xizmati ulanmayapti.");
          const audioContext = new AudioContext({ sampleRate: 16000 });
          await audioContext.resume();
          const client = new GoogleGenAI({ apiKey: tokenData.token, httpOptions: { apiVersion: "v1alpha" } });
          const live = { running: false, audioContext, session: null, stream: null, source: null, processor: null, nextAudioTime: audioContext.currentTime, playingCount: 0 };
          liveVoiceRef.current = live;
          live.session = await client.live.connect({

            config: { responseModalities: ["AUDIO"], inputAudioTranscription: {}, outputAudioTranscription: {}, realtimeInputConfig: { automaticActivityDetection: { disabled: true } }, systemInstruction: "Sen Bilimdon Kids AI platformasining mehribon o‘zbek tilida gapiradigan AI Ustozisan. 5–12 yoshli bolaga qisqa, aniq va quvnoq javob ber. Har bir savolga faqat bir marta javob qaytar. Javobni tez boshlagin va ortiqcha izoh bermagin.", sessionResumption: {}, thinkingConfig: { thinkingLevel: "minimal" } },
            callbacks: {
              onopen: () => console.info("BILIMDON KIDS AI ovozli tizimi ulandi"),
              onmessage: message => {
                const inputText = message?.serverContent?.inputTranscription?.text;
                if (inputText) setChatInput(inputText);
                const outputText = message?.serverContent?.outputTranscription?.text;
                if (outputText) setTutorReply(prev => prev.startsWith("Siz:") || prev.includes("ulanmoqda") || prev.includes("Tinglayapman") ? outputText : prev + outputText);
                const parts = message?.serverContent?.modelTurn?.parts;
                if (Array.isArray(parts)) for (const part of parts) {
                  const audioData = part?.inlineData?.data;
                  if (!audioData) continue;
                  try {
                    const binary = atob(audioData);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    const samples = new Int16Array(bytes.buffer, bytes.byteOffset, Math.floor(bytes.byteLength / 2));
                    const buffer = audioContext.createBuffer(1, samples.length, 24000);
                    const channel = buffer.getChannelData(0);
                    for (let i = 0; i < samples.length; i++) channel[i] = samples[i] / 32768;
                    const source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    source.playbackRate.value = 1.12;
                    source.connect(audioContext.destination);
                    const startAt = Math.max(audioContext.currentTime, live.nextAudioTime);
                    live.nextAudioTime = startAt + buffer.duration;
                    live.playingCount++;
                    setIsAiSpeaking(true);
                    source.onended = () => { live.playingCount = Math.max(0, live.playingCount - 1); if (!live.playingCount) setIsAiSpeaking(false); };
                    source.start(startAt);
                  } catch (audioError) { console.error("AI ovoz ijrosi:", audioError); }
                }
              },
              onerror: error => { console.error("AI ovozli aloqa xatosi:", error); setTutorReply("Ovozli AI bilan aloqa uzildi. Mikrofon tugmasini qayta bosing."); },
              onclose: () => { if (liveVoiceRef.current === live) { live.running = false; liveConnectingRef.current = false; try { live.processor?.disconnect(); live.source?.disconnect(); live.stream?.getTracks()?.forEach(track => track.stop()); live.audioContext?.close(); } catch {} liveVoiceRef.current = null; setIsVoiceRec(false); setIsAiSpeaking(false); } }
            }
          });
          live.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
          live.source = audioContext.createMediaStreamSource(live.stream);
          live.processor = audioContext.createScriptProcessor(4096, 1, 1);
          let turnActive = false;
          let silentFrames = 0;
          live.processor.onaudioprocess = event => {
            if (!live.running || !live.session || audioContext.currentTime < live.nextAudioTime) return;
            const input = event.inputBuffer.getChannelData(0);
            let energy = 0;
            for (let i = 0; i < input.length; i++) energy += input[i] * input[i];
            const speaking = Math.sqrt(energy / input.length) >= 0.015;
            if (speaking && !turnActive) { turnActive = true; silentFrames = 0; live.session.sendRealtimeInput({ activityStart: {} }); }
            if (!turnActive) return;
            const pcm = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) { const sample = Math.max(-1, Math.min(1, input[i])); pcm[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff; }
            const raw = new Uint8Array(pcm.buffer);
            let binary = "";
            for (let i = 0; i < raw.length; i += 0x8000) binary += String.fromCharCode(...raw.subarray(i, Math.min(i + 0x8000, raw.length)));
            live.session.sendRealtimeInput({ audio: { data: btoa(binary), mimeType: "audio/pcm;rate=16000" } });
            if (speaking) silentFrames = 0;
            else if (++silentFrames >= 12) { live.session.sendRealtimeInput({ activityEnd: {} }); turnActive = false; silentFrames = 0; }
          };
          const silentGain = audioContext.createGain();
          silentGain.gain.value = 0;
          live.source.connect(live.processor);
          live.processor.connect(silentGain);
          silentGain.connect(audioContext.destination);
          live.running = true;
          liveConnectingRef.current = false;

        const currentHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([currentHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // Yozish ekrani uchun harf shablonini chizish
      const drawLetterGuide = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        const currentLetter = LETTERS_LIST[letterIdx];
        ctx.save();
        ctx.font = '900 155px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#64748B';
        ctx.lineWidth = 4;
        ctx.setLineDash([10, 10]);
        ctx.strokeText(currentLetter, w / 2, h / 2 + 8);
        ctx.restore();
      };

      useEffect(() => {
        drawLetterGuide();
        setStrokeCount(0);
      }, [letterIdx, activeScreen, viewMode]);

      const getCanvasCoords = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return { x: 0, y: 0 };
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: ((clientX - rect.left) / rect.width) * canvas.width,
          y: ((clientY - rect.top) / rect.height) * canvas.height
        };
      };

      const startDraw = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const { x, y } = getCanvasCoords(e);
        setIsDrawing(true);
        ctx.beginPath();
        ctx.moveTo(x, y);
      };

      const moveDraw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const { x, y } = getCanvasCoords(e);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 14;
        ctx.strokeStyle = '#2563EB';
        ctx.setLineDash([]);
        ctx.lineTo(x, y);
        ctx.stroke();
        setStrokeCount((c) => c + 1);
      };

            <label className="block text-xs font-bold text-slate-300">Ota-ona ismi<input value={profileFullName} onChange={e=>setProfileFullName(e.target.value)} className="mt-1 w-full rounded-xl bg-slate-800 border border-white/10 p-3 text-white"/></label>
            <div className="grid grid-cols-2 gap-3"><label className="block text-xs font-bold text-slate-300">Bola ismi<input value={profileChildName} onChange={e=>setProfileChildName(e.target.value)} className="mt-1 w-full rounded-xl bg-slate-800 border border-white/10 p-3 text-white"/></label><label className="block text-xs font-bold text-slate-300">Yoshi (5–12)<input type="number" min="5" max="12" value={profileAge} onChange={e=>setProfileAge(e.target.value)} className="mt-1 w-full rounded-xl bg-slate-800 border border-white/10 p-3 text-white"/></label></div>
            <div className="border-t border-white/10 pt-3 space-y-2"><p className="text-sm font-black text-emerald-200">Parolni almashtirish (ixtiyoriy)</p><input type="password" value={profileCurrentPassword} onChange={e=>setProfileCurrentPassword(e.target.value)} placeholder="Joriy parol" className="w-full rounded-xl bg-slate-800 border border-white/10 p-3 text-white"/><input type="password" value={profileNewPassword} onChange={e=>setProfileNewPassword(e.target.value)} placeholder="Yangi parol (kamida 10 belgi)" className="w-full rounded-xl bg-slate-800 border border-white/10 p-3 text-white"/></div>
            {profileMessage && <p className="rounded-xl bg-white/10 p-3 text-sm font-bold text-emerald-200">{profileMessage}</p>}<button disabled={profileBusy} onClick={saveProfile} className="w-full rounded-xl bg-gradient-to-r from-emerald-400 to-cyan-400 p-3 font-black text-slate-950 disabled:opacity-50">{profileBusy?'Saqlanmoqda...':'O‘zgarishlarni saqlash'}</button>
          </div></div>}

          {/* GITHUB VA APK QO'LLANMA MODALI */}
          {showGithubApkModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-slate-900 text-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border-2 border-emerald-400/50 space-y-4">
                <div className="flex items-center justify-between border-b border-white/10 pb-3">
                  <div>
                    <h3 className="font-black text-lg text-emerald-300">
                      📦 GitHub Pages + Android (.APK) Tayyor Paket Маркази
                    </h3>
                    <p className="text-xs text-slate-400">
                      Muallif: {AUTHOR_INFO.fullName} ({AUTHOR_INFO.university})
                    </p>
                  </div>
                  <button
                    onClick={() => setShowGithubApkModal(false)}
                    className="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 font-black"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex flex-wrap gap-2">
                  {[
                    { id: 'zip', label: '📦 1. Tayyor ZIP va HTML Yuklab Olish' },
                    { id: 'github', label: '🌐 2. GitHub Pages-da Online Qilish' },
                    { id: 'apk', label: '📱 3. Tayyor Android (.APK) Chiqarish' }
                  ].map((t) => (
                    <button
                      key={t.id}
                      onClick={() => setApkModalTab(t.id)}
                      className={`px-3 py-2 rounded-xl font-extrabold text-xs ${
                        apkModalTab === t.id ? 'bg-emerald-400 text-slate-950' : 'bg-white/10 text-slate-300'
                      }`}
                    >
                      {t.label}
                    </button>
                  ))}
                </div>

                {apkModalTab === 'zip' && (
                  <div className="bg-slate-800 rounded-2xl p-5 space-y-4 text-xs leading-relaxed text-slate-200">
                    <p className="text-amber-300 font-black text-sm">
                      Quyidagi tugmani bossangiz, kompyuteringizga yoki telefoningizga barcha fayllar jamlangan tayyor <code>bilimdon-kids-github-va-apk.zip</code> arxivi yuklab olinadi:
                    </p>
                    <ul className="list-disc list-inside space-y-1 text-slate-300">
                      <li><code>index.html</code> — To‘liq 8 ta ekranli interaktiv dastur (Saparova Matluba muallifligida)</li>
                      <li><code>manifest.json</code> va <code>sw.js</code> — Mobil telefonlarga ilova bo‘lib o‘rnatish (PWA/APK) fayllari</li>
                      <li><code>capacitor.config.json</code> — Android Studio / Capacitor APK konfiguratsiyasi</li>
                      <li><code>README.md</code> — GitHub uchun tayyor rasmiy pasport va yo‘riqnoma</li>
                    </ul>
                    <div className="flex flex-wrap gap-3 pt-2">
                      <button
                        onClick={handleDownloadGithubAndApkZip}
                        className="px-5 py-3 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 font-black text-xs shadow-lg"
                      >
                        📦 Tayyor ZIP Paketni Yuklab Olish (.ZIP)
                      </button>
                      <button
                        onClick={handleDownloadSingleHtml}
                        className="px-5 py-3 rounded-2xl bg-amber-400 text-slate-950 font-black text-xs shadow-lg"
                      >
                        📄 Yagona index.html Faylni Yuklab Olish
                      </button>
                    </div>
                  </div>
                )}

                {apkModalTab === 'github' && (
                  <div className="bg-slate-800 rounded-2xl p-5 space-y-2.5 text-xs leading-relaxed text-slate-200">
                    <p className="text-cyan-300 font-black text-sm">GitHub Pages yoki Netlify orqali 1 daqiqada internetga joylash:</p>
                    <ol className="list-decimal list-inside space-y-2">
                      <li>Yuqoridagi tugma orqali <b>ZIP</b> faylni yuklab oling va ichidagi fayllarni oching.</li>
                      <li><b>github.com</b> saytida yangi Repository yarating (masalan: <code>bilimdon-kids</code>).</li>
                      <li><b>Add file ➔ Upload files</b> orqali <code>index.html</code>, <code>manifest.json</code> va <code>sw.js</code> fayllarini tashlang va <b>Commit changes</b> bosing.</li>
                      <li>Repository ichida <b>Settings ➔ Pages ➔ Branch: main ➔ Save</b> tugmasini bosing — 60 soniyadan so‘ng shaxsiy online saytingiz ishga tushadi!</li>
                    </ol>
                  </div>
                )}

                {apkModalTab === 'apk' && (
                  <div className="bg-slate-800 rounded-2xl p-5 space-y-2.5 text-xs leading-relaxed text-slate-200">
                    <p className="text-amber-300 font-black text-sm">Telefonga o‘rnatiladigan haqiqiy Android (.APK) fayl olishning 2 ta bepul yo‘li:</p>
                    <div className="bg-slate-900/90 p-3.5 rounded-xl border border-white/10 space-y-1.5">
                      <p className="font-black text-emerald-300">1-Usul: WebIntoApp.com (Eng tez — 30 soniyada HTML/ZIP dan APK olish)</p>
                      <p>1. <b>webintoapp.com/html-to-app</b> saytiga kiring.</p>
                      <p>2. Bizning <b>📦 Tayyor ZIP</b> yoki <b>index.html</b> faylimizni yuklang.</p>
                      <p>3. App Name qismiga <b>Bilimdon Kids</b> deb yozib, <b>Make App (Download Free APK)</b> tugmasini bosing!</p>
                    </div>
                    <div className="bg-slate-900/90 p-3.5 rounded-xl border border-white/10 space-y-1.5">
                      <p className="font-black text-cyan-300">2-Usul: PWABuilder.com (GitHub Pages linkidan rasmiy APK olish)</p>
                      <p>1. GitHub Pages yoki Netlify linkini <b>pwabuilder.com</b> saytiga kiriting.</p>
                      <p>2. <b>Package for stores ➔ Android ➔ Download APK</b> tugmasini bosing!</p>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
